name: Claude Code Review (deferred)

# Inert placeholder. Reintroducing review requires immutable input identity,
# enforced tool/credential restrictions and a separately reviewed output route.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-review-deferred
  cancel-in-progress: false

jobs:
  deferred:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report deferred capability
        shell: bash
        run: printf '%s\n' 'Credential-backed review is disabled and deferred; no review was performed.'
