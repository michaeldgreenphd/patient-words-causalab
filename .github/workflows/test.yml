name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Explicitly authorize the heavyweight non-golden suite"
        type: boolean
        default: false
      expected_commit:
        description: "Exact reviewed main commit; equality assertion, not a checkout ref"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  review-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same Ruff version as .pre-commit-config.yaml, without mutation or autofix.
      - name: Lint and format checks without the runtime dependency environment
        run: |
          python -I - <<'PYCODE'
          import os
          from pathlib import Path
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          paths = [os.fsdecode(p) for p in tracked if p]
          paths = [p for p in paths if Path(p).is_file() and Path(p).suffix in {".py", ".pyi"}]
          if not paths:
              raise SystemExit("No tracked Python files found for Ruff checks")
          for start in range(0, len(paths), 100):
              batch = paths[start:start + 100]
              for command in (["check"], ["format", "--check"]):
                  subprocess.run(["uvx", "--from", "ruff==0.14.5", "ruff", *command, "--force-exclude", "--", *batch],
                                 check=True)
          PYCODE
      - name: Python syntax and tracked file size checks
        run: |
          python -I -m compileall -q causalab tests
          python -I - <<'PY'
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          oversized = [p.decode() for p in paths if p and pathlib.Path(p.decode()).is_file()
                       and pathlib.Path(p.decode()).stat().st_size > 51200 * 1024]
          if oversized:
              raise SystemExit("Tracked files exceed the existing 50 MiB limit: " + repr(oversized))
          PY
      # Rust formatting is deferred for this bootstrap: PR-controlled toolchain
      # and formatter configuration must not select automatic executables.
      # Reintroducing it requires a separately reviewed input-isolation design.

  full-suite:
    # This job is deliberately absent from automatic PR/push coverage. It keeps
    # the existing suite available only after a separate owner authorization.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.full_suite &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    needs: review-checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require the reviewed dispatch commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] && [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || exit 2
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the existing locked runtime
        run: uv sync --frozen
      - name: Run the existing heavyweight test selection
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync pytest -v -m "not golden" --junit-xml=pytest.xml
      # Results stay in the job log; no checks/pull-request write token is used.
